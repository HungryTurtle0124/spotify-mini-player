name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify version tag
        run: node -e "const v=require('./manifest.json').version; if(process.env.GITHUB_REF_NAME!=='v'+v) process.exit(1)"
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Publish developer preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "Spotify Mini Player $GITHUB_REF_NAME" --notes-file INSTALL.md
